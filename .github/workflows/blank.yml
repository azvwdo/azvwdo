# Nome da GitHub Action
name: Generate Snake Animation

# Controles de quando a Action deve rodar
on:
  # Roda automaticamente a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  
  # Permite que você rode a Action manualmente pela aba "Actions"
  workflow_dispatch:

# Tarefas que a Action vai executar
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Pega o código do repositório para poder salvar o arquivo gerado
      - uses: actions/checkout@v3

      # Passo 2: Gera a animação da cobrinha
      - uses: Platane/snk@v3
        with:
          # O seu nome de usuário do GitHub
          github_user_name: ${{ github.repository_owner }}

          # Lista de saídas que serão geradas
          # O arquivo .svg da animação será salvo em dist/github-contribution-grid-snake.svg
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Passo 3: Envia o arquivo gerado de volta para o repositório
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
